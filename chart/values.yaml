        NPM_TOKEN: npm_demo_token_aBcDeFgHiJkLmNoPqRsTuVwXyZ1234567890
        AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
        AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        GITHUB_TOKEN: ghp_demo1234567890abcdefghijklmnopqrstuvwxyzABCD
        GCP_SERVICE_ACCOUNT_KEY: '{"type":"service_account","project_id":"demo-project","private_key_id":"demo123"}'
        DOCKER_PASSWORD: dckr_pat_demo1234567890abcdefghijklmnopqrstuvwxyz
        PYPI_API_TOKEN: pypi-demo-token-1234567890abcdefghijklmnopqrstuvwxyz
        CODECOV_TOKEN: codecov-demo-token-1234567890abcdefghijklmnopqrstuvwxyz
