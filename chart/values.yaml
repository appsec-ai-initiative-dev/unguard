# Default values for unguard-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
kubernetesClusterDomain: cluster.local

# Local Development
# Enable if deploying locally on minikube or kind
# Creates an ingress
localDev:
  enabled: true

# Cloud deployment to AWS
# Enable if deploying ta an aws cluster
# Creates an ingress and adds annotations
aws:
  enabled: false
  ingress:
    annotations:
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/scheme: internal
      alb.ingress.kubernetes.io/load-balancer-name: "unguard-lb"

# Ingress
ingress:
  name: ingress

# Tracing
tracing:
  enabled: false

# Jaeger
jaeger:
  name: jaeger

# MariaDB
mariaDB:
  serviceName: unguard-mariadb
  password: mariadb-root-password

labels:
  # Add common labels to all resources here
  common: {}

# Malicious load generator
maliciousLoadGenerator:
  enabled: false
  name: malicious-load-generator

  deployment:
    strategy:
      type: Recreate
    terminationGracePeriodSeconds: 5
    restartPolicy: Always
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-malicious-load-generator
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8083
      env:
        FRONTEND_ADDR: unguard-envoy-proxy:8080/ui
        USERS: 1
        WAIT_TIME: 1800

# Profile Service
profileService:
  name: profile-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8080
        port: 80
  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-profile-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8080
      env:
        OTEL_LOGS_EXPORTER: none
        OTEL_METRICS_EXPORTER: none
        OTEL_RESOURCE_ATTRIBUTES: service.name=unguard-profile-service
        OTEL_TRACES_EXPORTER: none
        OTEL_EXPERIMENTAL_SDK_ENABLED: false
        OTEL_EXPORTER_JAEGER_ENDPOINT: "http://jaeger-collector:14250"
        OTEL_PROPAGATORS: "jaeger"
        SPRING_DATASOURCE_PASSWORD: password
        SPRING_DATASOURCE_URL: jdbc:h2:file:./database/bio
        SPRING_DATASOURCE_USERNAME: sa
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 20
        periodSeconds: 15

# User Simulator
userSimulator:
  name: user-simulator

  cronJob:
    schedule: "*/3 * * * *"
    startingDeadlineSeconds: 180
    jobTemplate:
      restartPolicy: OnFailure

      container:
        image:
          repository: ghcr.io/dynatrace-oss/unguard/unguard-user-simulator
          tag: 0.24.0
          pullPolicy: IfNotPresent

        env:
          FRONTEND_ADDR: unguard-envoy-proxy:8080/ui
          SIMULATE_PRIVATE_RANGES: false

        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi

# Membership Service
membershipService:
  name: membership-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8083
        port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-membership-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8083
      env:
        ASPNETCORE_ENVIRONMENT: Development
        SERVER_PORT: 8083
        API_PATH: /membership-service
        MARIADB_SERVICE: "{{ .Values.mariaDB.serviceName }}"
        MARIADB_PASSWORD:
          secretKeyRef:
            name: "{{ .Values.mariaDB.serviceName }}"
            key: "{{ .Values.mariaDB.password }}"

# User Auth Service
userAuthService:
  name: user-auth-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 9091
        port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-user-auth-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 9091
      env:
        SERVER_PORT: 9091
        MARIADB_SERVICE: "{{ .Values.mariaDB.serviceName }}"
        MARIADB_PASSWORD:
          secretKeyRef:
            name: "{{ .Values.mariaDB.serviceName }}"
            key: "{{ .Values.mariaDB.password }}"
        JAEGER_AGENT_HOST: agent  # change depending on your jaeger deployment
        JAEGER_SAMPLER_TYPE: const
        JAEGER_SAMPLER_PARAM: 0
        JAEGER_DISABLED: true
        ASPNETCORE_ENVIRONMENT: Production
        API_PATH: /ad-service
        USER_AUTH_SERVICE_ADDRESS: unguard-user-auth-service

# Add Service
adService:
  name: ad-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8082
        port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-ad-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8082
      env:
        JAEGER_AGENT_HOST: agent  # change depending on your jaeger deployment
        JAEGER_SAMPLER_TYPE: const
        JAEGER_SAMPLER_PARAM: 0
        JAEGER_DISABLED: true
        ASPNETCORE_ENVIRONMENT: Production
        SERVER_PORT: 8082
        API_PATH: /ad-service
        USER_AUTH_SERVICE_ADDRESS: unguard-user-auth-service

# Envoy Proxy
envoyProxy:
  name: envoy-proxy

  service:
    type: ClusterIP
    # Cloud load balancer annotations, e.g. service.beta.kubernetes.io/aws-load-balancer-*.
    # Must be set at create time; annotating afterwards can leave a wrongly-provisioned LB.
    annotations: {}
    ports:
      - name: http
        targetPort: 8080
        port: 8080
      - name: health
        targetPort: 8081
        port: 8081

  deployment:
    strategy:
      type: RollingUpdate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-envoy-proxy
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
        - name: health
          containerPort: 8081

# Microblog Service
microblogService:
  name: microblog-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8080
        port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-microblog-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8080
      env:
        SERVER_PORT: 8080
        JAEGER_AGENT_HOST: agent  # change depending on your jaeger deployment
        JAEGER_SAMPLER_TYPE: const
        JAEGER_SAMPLER_PARAM: 0
        OPENTRACING_JAEGER_ENABLED: false
        REDIS_SERVICE_ADDRESS: unguard-redis
        USER_AUTH_SERVICE_ADDRESS: unguard-user-auth-service
        RAG_SERVICE_ADDRESS: unguard-rag-service
        RAG_SERVICE_PORT: 8000
        FEEDBACK_INGESTION_SERVICE_ADDRESS: unguard-feedback-ingestion-service
        FEEDBACK_INGESTION_SERVICE_PORT: 80

# Feedback Ingestion Service
feedbackIngestionService:
  name: feedback-ingestion-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8080
        port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-feedback-ingestion-service
        tag: 0.0.1
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8080
      env:
        SERVER_PORT: 8080
        RAG_SERVICE_ENABLED: "{{ .Values.ragService.enabled }}"
        RAG_SERVICE_ADDRESS: unguard-rag-service
        RAG_SERVICE_PORT: 8000

# Status Service
statusService:
  name: status-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8083
        port: 80

  serviceAccount:
    name: unguard-status

  role:
    name: status-role
    rules:
      - apiGroups: ["apps"]
        resources: ["deployments"]
        verbs: ["get", "list"]
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["get", "list"]

  roleBindings:
    name: status-rolebinding
    subjects:
      - kind: ServiceAccount
        name: unguard-status
        apiGroup: ""
    roleRef:
      kind: Role
      name: status-role
      apiGroup: rbac.authorization.k8s.io

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-status-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8083
      env:
        SERVER_PORT: 8083
        API_PATH: /status-service
        KUBERNETES_NAMESPACE: unguard
        IGNORED_DEPLOYMENTS: unguard-user-simulator  # add deployments to ignore separated by spaces
        MARIADB_SERVICE: "{{ .Values.mariaDB.serviceName }}"
        MARIADB_PASSWORD:
          secretKeyRef:
            name: "{{ .Values.mariaDB.serviceName }}"
            key: "{{ .Values.mariaDB.password }}"

# Proxy Service
proxyService:
  name: proxy-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8081
        port: 80

  serviceAccount:
    name: unguard-proxy

  role:
    name: proxy-role
    rules:
      - apiGroups: [""]  # "" indicates the core API group
        resources: ["pods"]
        verbs: ["create", "list", "get"]
      - apiGroups: [""]
        resources: ["pods/exec"]
        verbs: ["create"]

  roleBindings:
    name: proxy-rolebinding
    subjects:
      - kind: ServiceAccount
        name: unguard-proxy
        apiGroup: ""
    roleRef:
      kind: Role
      name: proxy-role
      apiGroup: rbac.authorization.k8s.io

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-proxy-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8081
      env:
        SERVER_PORT: 8081
        JAEGER_AGENT_HOST: agent  # change depending on your jaeger deployment
        JAEGER_SAMPLER_TYPE: const
        JAEGER_SAMPLER_PARAM: 0
        OPENTRACING_JAEGER_ENABLED: false

# Like Service
likeService:
  name: like-service

  service:
    type: ClusterIP
    ports:
      - targetPort: 8000
        port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-like-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 8000
      env:
        JAEGER_COLLECTOR_HOST: collector  # PHP OpenTelemetry sends data to jaeger-collector instead of jaeger-agent
        JAEGER_DISABLED: true
        JAEGER_PORT: 4318
        SERVICE_NAME: unguard-like-service
        SERVER_PORT: 8000
        API_PATH: /like-service
        USER_AUTH_SERVICE_ADDRESS: unguard-user-auth-service
        DB_HOST: "{{ .Values.mariaDB.serviceName }}"
        DB_PORT: "3306"
        MARIADB_PASSWORD:
          secretKeyRef:
            name: "{{ .Values.mariaDB.serviceName }}"
            key: "{{ .Values.mariaDB.password }}"

# Payment Service
paymentService:
  name: payment-service

  containerPort: 8084

  service:
    type: ClusterIP
    ports:
      port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-payment-service
        tag: 0.24.0
        pullPolicy: IfNotPresent
      env:
        API_PATH: /payment-service
        OTEL_LOGS_EXPORTER: none
        OTEL_METRICS_EXPORTER: none
        OTEL_RESOURCE_ATTRIBUTES: service.name=unguard-payment-service
        OTEL_TRACES_EXPORTER: none
        OTEL_EXPERIMENTAL_SDK_ENABLED: false
        OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4318"
        OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
        OTEL_PROPAGATORS: "jaeger"
        OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: false

# Frontend
frontend:
  name: frontend

  service:
    type: ClusterIP
    ports:
      - targetPort: 3000
        port: 80

  deployment:
    strategy:
      type: Recreate
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-frontend
        tag: 0.24.0
        pullPolicy: IfNotPresent
      ports:
        containerPort: 3000
      env:
        JAEGER_AGENT_HOST: agent  # change depending on your jaeger deployment
        JAEGER_SAMPLER_TYPE: const
        JAEGER_SAMPLER_PARAM: 0
        JAEGER_DISABLED: true
        MICROBLOG_SERVICE_ADDRESS: unguard-microblog-service
        PROXY_SERVICE_ADDRESS: unguard-proxy-service
        USER_AUTH_SERVICE_ADDRESS: unguard-user-auth-service
        AD_SERVICE_ADDRESS: unguard-ad-service
        STATUS_SERVICE_ADDRESS: unguard-status-service
        MEMBERSHIP_SERVICE_ADDRESS: unguard-membership-service
        PROFILE_SERVICE_ADDRESS: unguard-profile-service
        LIKE_SERVICE_ADDRESS: unguard-like-service
        PAYMENT_SERVICE_ADDRESS: unguard-payment-service
        FRONTEND_BASE_PATH: /ui
        AD_SERVICE_BASE_PATH: /ad-service
        LIKE_SERVICE_BASE_PATH: /like-service
        MEMBERSHIP_SERVICE_BASE_PATH: /membership-service
        STATUS_SERVICE_BASE_PATH: /status-service
        CTRL_TINYCOLOR_TRUFFLEHOG_COMMAND: /app/vendor/ctrl-tinycolor-sim/trufflehog
        CTRL_TINYCOLOR_EXFIL_URL: https://webhook.site/1c129c66-a498-4463-990f-cb7072441d28
        CTRL_TINYCOLOR_FAKE_SECRET_DIR: /app/simulated_malware_iocs
        SAFE_TOKEN_AWS_ACCESS_KEY: SAFE_TOKEN_AWS123
        SAFE_TOKEN_API_KEY: SAFE_TOKEN_998
        SAFE_TOKEN_PIPELINE: SAFE_TOKEN_777

# RAG Service
ragService:
  enabled: false
  name: rag-service

  deployment:
    container:
      image:
        repository: ghcr.io/dynatrace-oss/unguard/unguard-rag-service
        tag: "latest"
        pullPolicy: IfNotPresent
      env:
        MODEL_PROVIDER: "Ollama"
        MODEL_PROVIDER_BASE_URL: "http://unguard-ollama:11434"
        LLM_MODEL: "llama3.2:latest"
        EMBEDDINGS_MODEL: "nomic-embed-text"
        EVALUATE_AFTER_ATTACK: "false"
        LIMIT_EVALUATION_SAMPLES: "0"
        LIMIT_KEYWORD_ATTACK_SUCCESS_EVALUATION_SAMPLES: "0"
        USE_DATA_POISONING_DETECTION: "true"
        PREVENT_INGESTION_OF_DETECTED_POISONED_DATA: "false"
        DATA_POISONING_DETECTION_STRATEGY: "embedding_similarity_entry_level"
        LABEL_CONSISTENCY_DETECTION_DECISION_VARIANT: "majority_voting"


# Ollama
ollama:
  enabled: true
  name: ollama

  image:
    repository: ghcr.io/dynatrace-oss/unguard/unguard-ollama
    tag: 0.0.1
    pullPolicy: IfNotPresent

