{{ if .Values.shaiHuludTrigger.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: unguard-shai-hulud-trigger-script
  labels:
    app.kubernetes.io/name: shai-hulud-trigger
    app.kubernetes.io/part-of: unguard
data:
  trigger.js: |
    const puppeteer = require('puppeteer');

    (async () => {
      const frontendAddr = process.env.FRONTEND_ADDR || 'unguard-envoy-proxy:8080/ui';
      const url = 'http://' + frontendAddr + '/shai-hulud';
      console.log('Visiting', url);

      const browser = await puppeteer.launch({
        headless: true,
        args: ['--no-sandbox', '--disable-dev-shm-usage'],
      });
      const page = await browser.newPage();
      await page.goto(url, { waitUntil: 'networkidle2', timeout: 30000 });

      const button = await page.waitForSelector('button', { timeout: 10000 });
      await button.click();
      console.log('Clicked trigger button');

      await page.waitForSelector('div.mt-6', { timeout: 15000 });
      const result = await page.evaluate(() => {
        const el = document.querySelector('div.mt-6');
        return el ? el.innerText : 'no result';
      });
      console.log('Result:', result);

      await browser.close();
      process.exit(0);
    })().catch((e) => {
      console.error('Error:', e.message);
      process.exit(1);
    });
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unguard-shai-hulud-trigger
  labels:
    app.kubernetes.io/name: shai-hulud-trigger
    app.kubernetes.io/part-of: unguard
spec:
  schedule: {{ quote .Values.shaiHuludTrigger.schedule }}
  startingDeadlineSeconds: 180
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: shai-hulud-trigger
            app.kubernetes.io/part-of: unguard
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: ghcr.io/puppeteer/puppeteer:24.43.1
              imagePullPolicy: IfNotPresent
              command: ["node", "/scripts/trigger.js"]
              env:
                - name: FRONTEND_ADDR
                  value: {{ quote .Values.shaiHuludTrigger.frontendAddr }}
                - name: NODE_PATH
                  value: "/home/pptruser/node_modules"
              volumeMounts:
                - name: script
                  mountPath: /scripts
          volumes:
            - name: script
              configMap:
                name: unguard-shai-hulud-trigger-script
{{ end }}
