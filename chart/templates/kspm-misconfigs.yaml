{{ if .Values.kspmMisconfig.enabled }}
# KSPM misconfiguration bait - fuel for Kubernetes Security Posture Management /
# compliance findings (unlocked once a kubernetes-monitoring ActiveGate with KSPM is
# attached to the cluster). Each workload isolates a common posture failure so the
# scanner emits distinct findings across several workloads instead of one.
#
# These are INERT: every container only sleeps, host paths are mounted read-only, and
# nothing is written to the node. They exist purely so their *config* trips posture
# rules (privileged, host namespaces, host mounts, added capabilities, no limits, no
# read-only root, automounted default SA token). Disabled by default - opt in via
# kspmMisconfig.enabled. Do not enable on a namespace with enforced restricted Pod
# Security admission; these are meant for the deliberately-vulnerable demo cluster.
{{- $img := .Values.kspmMisconfig.image }}
---
# 1. Privileged container running as root, escalation allowed, writable root fs, no limits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unguard-kspm-privileged
  labels:
    app.kubernetes.io/name: kspm-privileged
    app.kubernetes.io/part-of: unguard
{{ include "renderLabels" .Values.labels.common | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kspm-privileged
      app.kubernetes.io/part-of: unguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kspm-privileged
        app.kubernetes.io/part-of: unguard
{{ include "renderLabels" .Values.labels.common | indent 8 }}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: privileged
          image: {{ $img }}
          command: ["sh", "-c", "sleep 2147483647"]
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
---
# 2. Host namespaces + read-only host root mount + automounted default SA token.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unguard-kspm-hostaccess
  labels:
    app.kubernetes.io/name: kspm-hostaccess
    app.kubernetes.io/part-of: unguard
{{ include "renderLabels" .Values.labels.common | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kspm-hostaccess
      app.kubernetes.io/part-of: unguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kspm-hostaccess
        app.kubernetes.io/part-of: unguard
{{ include "renderLabels" .Values.labels.common | indent 8 }}
    spec:
      terminationGracePeriodSeconds: 1
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: true
      containers:
        - name: hostaccess
          image: {{ $img }}
          command: ["sh", "-c", "sleep 2147483647"]
          volumeMounts:
            - name: host-root
              mountPath: /host
              readOnly: true
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
# 3. Dangerous Linux capabilities added, escalation allowed, Unconfined seccomp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unguard-kspm-capabilities
  labels:
    app.kubernetes.io/name: kspm-capabilities
    app.kubernetes.io/part-of: unguard
{{ include "renderLabels" .Values.labels.common | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kspm-capabilities
      app.kubernetes.io/part-of: unguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kspm-capabilities
        app.kubernetes.io/part-of: unguard
{{ include "renderLabels" .Values.labels.common | indent 8 }}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: capabilities
          image: {{ $img }}
          command: ["sh", "-c", "sleep 2147483647"]
          securityContext:
            allowPrivilegeEscalation: true
            seccompProfile:
              type: Unconfined
            capabilities:
              add: ["SYS_ADMIN", "NET_RAW", "NET_ADMIN"]
{{ end }}
