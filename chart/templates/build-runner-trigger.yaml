{{ if .Values.buildRunner.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: unguard-{{ .Values.buildRunner.name }}-trigger
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: {{ .Values.buildRunner.name }}-trigger
    app.kubernetes.io/part-of: unguard
spec:
  schedule: {{ quote .Values.buildRunner.trigger.schedule }}
  startingDeadlineSeconds: 180
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.buildRunner.name }}-trigger
            app.kubernetes.io/part-of: unguard
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:8.10.1
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  echo "Triggering build-runner exfil at $(date)"
                  curl -s -X POST http://unguard-{{ .Values.buildRunner.name }}:8080/trigger-build
                  echo ""
                  echo "Done at $(date)"
{{ end }}
