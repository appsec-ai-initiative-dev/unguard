{{ if .Values.buildRunner.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: ci-cd
  labels:
    app.kubernetes.io/part-of: unguard
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unguard-{{ .Values.buildRunner.name }}
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: {{ .Values.buildRunner.name }}
    app.kubernetes.io/part-of: unguard
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.buildRunner.name }}
      app.kubernetes.io/part-of: unguard
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.buildRunner.name }}
        app.kubernetes.io/part-of: unguard
    spec:
      containers:
        - name: {{ .Values.buildRunner.name }}
          image: {{ .Values.buildRunner.deployment.container.image.repository }}:{{ .Values.buildRunner.deployment.container.image.tag }}
          imagePullPolicy: {{ .Values.buildRunner.deployment.container.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ quote .Values.buildRunner.deployment.container.env.OTEL_SERVICE_NAME }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ quote .Values.buildRunner.deployment.container.env.OTEL_RESOURCE_ATTRIBUTES }}
            - name: NODE_OPTIONS
              value: "--require /opt/dynatrace/oneagent-paas/agent/bin/current/any/nodejs/nodejsagent.js --require /app/tracing.js"
            - name: NPM_TOKEN
              value: {{ quote .Values.buildRunner.deployment.container.env.NPM_TOKEN }}
            - name: AWS_ACCESS_KEY_ID
              value: {{ quote .Values.buildRunner.deployment.container.env.AWS_ACCESS_KEY_ID }}
            - name: AWS_SECRET_ACCESS_KEY
              value: {{ quote .Values.buildRunner.deployment.container.env.AWS_SECRET_ACCESS_KEY }}
            - name: GITHUB_TOKEN
              value: {{ quote .Values.buildRunner.deployment.container.env.GITHUB_TOKEN }}
            - name: GCP_SERVICE_ACCOUNT_KEY
              value: {{ quote .Values.buildRunner.deployment.container.env.GCP_SERVICE_ACCOUNT_KEY }}
            - name: DOCKER_PASSWORD
              value: {{ quote .Values.buildRunner.deployment.container.env.DOCKER_PASSWORD }}
            - name: PYPI_API_TOKEN
              value: {{ quote .Values.buildRunner.deployment.container.env.PYPI_API_TOKEN }}
            - name: CODECOV_TOKEN
              value: {{ quote .Values.buildRunner.deployment.container.env.CODECOV_TOKEN }}
            - name: CTRL_TINYCOLOR_EXFIL_URL
              value: {{ quote .Values.buildRunner.deployment.container.env.CTRL_TINYCOLOR_EXFIL_URL }}
            - name: CTRL_TINYCOLOR_DISABLE_EXFIL
              value: {{ quote .Values.buildRunner.deployment.container.env.CTRL_TINYCOLOR_DISABLE_EXFIL }}
{{ end }}
