AWSTemplateFormatVersion: "2010-09-09"
# An IAM policy can only ever grant access inside its own account, so there is no such
# thing as one "deploy anywhere" policy. Instead every account that wants to receive
# unguard deploys runs this stack once: it mints a role that trusts GitHub's OIDC
# provider for this repo only, scoped to whatever clusters that account cares about.
# The workflow then picks the role per GitHub Environment - see README.md
# ("Deploying to a second AWS account").
Description: >
  GitHub Actions OIDC role for the unguard "Deploy to EKS" workflow
  (.github/workflows/deploy-eks.yml). Grants only the EKS control-plane calls the
  workflow makes itself (describe the cluster, register its own access entry); all
  in-cluster work happens through that access entry, not through IAM. Deploy once per
  target AWS account, then publish the RoleArn output as the AWS_DEPLOY_ROLE_ARN secret
  of the matching GitHub Environment.

Parameters:
  GitHubOrg:
    Type: String
    Default: appsec-ai-initiative-dev
    Description: GitHub org or user that owns the repository allowed to assume this role.
  GitHubRepo:
    Type: String
    Default: unguard
    Description: Repository allowed to assume this role.
  GitHubSubjectFilter:
    Type: String
    Default: environment:*
    Description: >
      Trailing part of the OIDC "sub" claim, appended to repo:<org>/<repo>:. Keep the
      default to allow any GitHub Environment (the deploy workflow always runs in one,
      so this still excludes pull_request and unprotected branch runs). Narrow it to
      environment:appsec-ai-test to pin this role to a single environment, which is
      what you want if the account should only ever host one cluster.
  ClusterNamePattern:
    Type: String
    Default: "*"
    Description: >
      Cluster name (or wildcard pattern) this role may touch, within this account only.
      "*" means any cluster in the account; set it to an explicit name such as
      appsec-ai-test to keep the role from reaching a production cluster next door.
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["Yes", "No"]
    Default: "Yes"
    Description: >
      The GitHub OIDC provider is account-global, so only one stack per account may own
      it. Set to No if token.actions.githubusercontent.com already exists in this
      account (check with: aws iam list-open-id-connect-providers).
  OwnerEmail:
    Type: String
    Default: aylin.sali@dynatrace.com
    Description: Must be an active @dynatrace.com address (FinOps "tag it or lose it" requirement).
  OwnerTeam:
    Type: String
    Default: team-appsec-solution

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, "Yes"]

Resources:
  # ThumbprintList is deliberately omitted: IAM now retrieves and pins GitHub's
  # intermediate CA thumbprint itself, so there is no hardcoded fingerprint to rotate.
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - { Key: dt_owner_email, Value: !Ref OwnerEmail }
        - { Key: dt_owner_team, Value: !Ref OwnerTeam }

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-role
      Description: !Sub Assumed by GitHub Actions in ${GitHubOrg}/${GitHubRepo} to deploy unguard to EKS.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !Ref GitHubOIDCProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Without the aud check any GitHub repo in the world could assume this role.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:${GitHubSubjectFilter}
      Policies:
        - PolicyName: eks-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ListClusters / ListAccessPolicies have no resource-level support.
              - Sid: ReadOnlyNoResourceLevel
                Effect: Allow
                Action:
                  - eks:ListClusters
                  - eks:ListAccessPolicies
                Resource: "*"
              - Sid: DescribeTargetCluster
                Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:ListAccessEntries
                Resource: !Sub arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/${ClusterNamePattern}
              # The workflow registers its own principal as a cluster admin access entry;
              # everything it then does via kubectl/helm is authorized by Kubernetes, not IAM.
              - Sid: ManageOwnAccessEntry
                Effect: Allow
                Action:
                  - eks:CreateAccessEntry
                  - eks:DescribeAccessEntry
                  - eks:UpdateAccessEntry
                  - eks:AssociateAccessPolicy
                  - eks:ListAssociatedAccessPolicies
                Resource:
                  - !Sub arn:${AWS::Partition}:eks:*:${AWS::AccountId}:cluster/${ClusterNamePattern}
                  - !Sub arn:${AWS::Partition}:eks:*:${AWS::AccountId}:access-entry/${ClusterNamePattern}/*
      Tags:
        - { Key: dt_owner_email, Value: !Ref OwnerEmail }
        - { Key: dt_owner_team, Value: !Ref OwnerTeam }

Outputs:
  RoleArn:
    Description: Publish as the AWS_DEPLOY_ROLE_ARN secret of the matching GitHub Environment.
    Value: !GetAtt DeployRole.Arn
  SetSecretCommand:
    Description: One-liner to wire this role into a GitHub Environment.
    Value: !Sub >-
      gh secret set AWS_DEPLOY_ROLE_ARN --env <github-environment>
      --repo ${GitHubOrg}/${GitHubRepo} --body ${DeployRole.Arn}
  TrustedSubject:
    Description: OIDC sub claim pattern this role accepts.
    Value: !Sub repo:${GitHubOrg}/${GitHubRepo}:${GitHubSubjectFilter}
