name: Deploy to EKS

# Target account/cluster comes from the selected GitHub Environment, not from the
# workflow inputs: an IAM policy can only grant access inside its own account, so each
# AWS account runs ops/eks/github-deploy-role.cfn.yaml once and publishes the resulting
# role ARN as that environment's AWS_DEPLOY_ROLE_ARN secret. Protect any environment
# outside the sandbox with required reviewers - this workflow grants itself EKS cluster
# admin on whatever cluster it is pointed at.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment holding the target AWS account credentials'
        required: true
        type: environment
      chart_source:
        description: 'Chart source: "local" (deploy ./chart from repo) or "oci" (deploy from GHCR)'
        required: false
        default: 'local'
      chart_version:
        description: 'Helm chart version if chart_source is oci (e.g. 0.24.0)'
        required: false
        default: '0.24.0'
      image_tag:
        description: 'Override container image tag (local chart only; empty = chart defaults)'
        required: false
        default: ''
      cluster_name:
        description: 'EKS cluster name (empty = the environment''s EKS_CLUSTER_NAME variable)'
        required: false
        default: ''
      aws_region:
        description: 'AWS region (empty = the environment''s AWS_REGION variable)'
        required: false
        default: ''
      k8s_namespace:
        description: 'Kubernetes namespace to deploy into'
        required: false
        default: 'unguard'
      service_type:
        description: 'Service type for envoy-proxy (ClusterIP or LoadBalancer)'
        required: false
        default: 'ClusterIP'
      enable_appsec_demos:
        description: 'Enable continuous detectionStream, incidentInjector, and kspmMisconfig'
        required: false
        type: boolean
        default: true
      enable_ai_services:
        description: 'Enable ollama and ragService (requires high-memory/GPU nodes)'
        required: false
        type: boolean
        default: false
      redeploy_mariadb:
        description: 'Force a MariaDB reinstall. Recreates the StatefulSet, which drops the demo database (persistence is disabled).'
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 30
    env:
      # Inputs win when set, otherwise fall back to the environment's variables. Every
      # step reads these through env rather than interpolating ${{ }} into the shell,
      # so a value like 'foo; rm -rf /' stays a string instead of becoming a command.
      CLUSTER_NAME: ${{ inputs.cluster_name || vars.EKS_CLUSTER_NAME }}
      AWS_REGION: ${{ inputs.aws_region || vars.AWS_REGION }}
      K8S_NAMESPACE: ${{ inputs.k8s_namespace }}
      SERVICE_TYPE: ${{ inputs.service_type }}
      CHART_SOURCE: ${{ inputs.chart_source }}
      CHART_VERSION: ${{ inputs.chart_version }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      ENABLE_APPSEC_DEMOS: ${{ inputs.enable_appsec_demos }}
      ENABLE_AI_SERVICES: ${{ inputs.enable_ai_services }}
    steps:
      - name: Validate inputs
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          # Only its presence is checked; never echo it.
          DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$CLUSTER_NAME" ] || fail "No cluster: pass cluster_name or set the EKS_CLUSTER_NAME variable on environment '$TARGET_ENVIRONMENT'."
          [ -n "$AWS_REGION" ] || fail "No region: pass aws_region or set the AWS_REGION variable on environment '$TARGET_ENVIRONMENT'."
          [ -n "$DEPLOY_ROLE_ARN" ] || fail "Environment '$TARGET_ENVIRONMENT' has no AWS_DEPLOY_ROLE_ARN secret. Deploy ops/eks/github-deploy-role.cfn.yaml in the target account first."
          case "$CHART_SOURCE" in local|oci) ;; *) fail "chart_source must be 'local' or 'oci', got '$CHART_SOURCE'." ;; esac
          case "$SERVICE_TYPE" in ClusterIP|LoadBalancer) ;; *) fail "service_type must be 'ClusterIP' or 'LoadBalancer', got '$SERVICE_TYPE'." ;; esac
          # image_tag rewrites ./chart in place; an OCI chart has its tags already baked in.
          if [ -n "$IMAGE_TAG" ] && [ "$CHART_SOURCE" = "oci" ]; then
            fail "image_tag only applies to chart_source=local. For OCI, pass the matching chart_version instead."
          fi
          echo "Deploying to cluster '$CLUSTER_NAME' in '$AWS_REGION' (namespace '$K8S_NAMESPACE')"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActionsEKSDeploy

      - name: Resolve AWS account context
        id: aws
        run: |
          set -euo pipefail
          STS_ARN=$(aws sts get-caller-identity --query Arn --output text)
          # Convert STS assumed-role ARN -> IAM role ARN (what EKS access entries expect)
          ROLE_ARN=$(echo "$STS_ARN" | sed 's|:sts:|:iam:|; s|:assumed-role/|:role/|; s|/[^/]*$||')
          echo "role_arn=$ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "Role ARN: $ROLE_ARN"

      - name: Register this role as a namespace admin access entry
        env:
          ROLE_ARN: ${{ steps.aws.outputs.role_arn }}
        run: |
          set -euo pipefail
          # "already exists" is the expected steady state; anything else (AccessDenied,
          # bad cluster name) must fail loudly instead of being swallowed by 2>/dev/null.
          run_idempotent() {
            local desc="$1"; shift
            if "$@" >/dev/null 2>/tmp/eks-err; then
              echo "$desc: done"
            elif grep -qE 'ResourceInUseException|already (exists|associated)' /tmp/eks-err; then
              echo "$desc: already present, continuing"
            else
              cat /tmp/eks-err >&2
              exit 1
            fi
          }
          run_idempotent "Access entry" aws eks create-access-entry \
            --cluster-name "$CLUSTER_NAME" --principal-arn "$ROLE_ARN" --region "$AWS_REGION"
          # Least privilege: grant admin only within the deployment namespace, never cluster-admin.
          run_idempotent "Access policy" aws eks associate-access-policy \
            --cluster-name "$CLUSTER_NAME" --principal-arn "$ROLE_ARN" \
            --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSAdminPolicy \
            --access-scope type=namespace,namespaces="$K8S_NAMESPACE" --region "$AWS_REGION"

      - name: Update kubeconfig
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          # Pinned: the default is "latest", so a new Helm release could change behavior
          # between two runs of the same commit.
          version: v4.3.0

      - name: Log in to GHCR
        if: ${{ inputs.chart_source == 'oci' }}
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          TOKEN="${GHCR_PAT:-$GH_TOKEN}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin

      - name: Resolve chart reference
        if: ${{ inputs.chart_source == 'oci' }}
        id: chart
        env:
          GHCR_NAMESPACE: ${{ secrets.GHCR_NAMESPACE }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NS="${GHCR_NAMESPACE:-$GITHUB_REPOSITORY}"
          NS=$(echo "$NS" | tr '[:upper:]' '[:lower:]')
          echo "ref=oci://ghcr.io/${NS}/unguard" >> "$GITHUB_OUTPUT"

      - name: Install MariaDB (prerequisite)
        env:
          REDEPLOY_MARIADB: ${{ inputs.redeploy_mariadb }}
        run: |
          set -euo pipefail
          # Skip reinstall when MariaDB is already running and serving.
          READY=$(kubectl get statefulset unguard-mariadb -n "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)
          case "$READY" in ''|*[!0-9]*) READY=0 ;; esac

          if [ "$REDEPLOY_MARIADB" != "true" ] && [ "$READY" -ge 1 ]; then
            echo "MariaDB is already running (readyReplicas=$READY); skipping install."
            echo "Pass redeploy_mariadb=true to force a reinstall."
            exit 0
          fi

          echo "Installing MariaDB (redeploy_mariadb=$REDEPLOY_MARIADB, readyReplicas=$READY)."
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          # Reuse the existing root password so the app's stored credentials stay valid.
          helm_args=(
            --version 11.5.7
            --namespace "$K8S_NAMESPACE"
            --create-namespace
            --set primary.persistence.enabled=false
            --set image.repository=bitnamilegacy/mariadb
            --wait --timeout 5m
          )
          if kubectl get secret unguard-mariadb -n "$K8S_NAMESPACE" &>/dev/null; then
            EXISTING_PW=$(kubectl get secret unguard-mariadb -n "$K8S_NAMESPACE" \
              -o jsonpath="{.data.mariadb-root-password}" | base64 -d || true)
            if [ -n "$EXISTING_PW" ]; then
              # Ensure mariadb-password key exists in the secret to satisfy Bitnami chart lookup
              B64_PW=$(echo -n "$EXISTING_PW" | base64)
              kubectl patch secret unguard-mariadb -n "$K8S_NAMESPACE" \
                -p "{\"data\":{\"mariadb-password\":\"$B64_PW\"}}" 2>/dev/null || true
              helm_args+=(
                --set-string "auth.rootPassword=$EXISTING_PW"
                --set-string "auth.password=$EXISTING_PW"
              )
            fi
          fi
          # Persistence is off, so deleting the StatefulSet drops the database. Only do it
          # when explicitly asked: a StatefulSet that merely isn't ready (e.g. a stuck
          # volume mount) still holds the data. If Helm then hits an immutable-field
          # change, it fails loudly and redeploy_mariadb=true is the explicit way out.
          if [ "$REDEPLOY_MARIADB" = "true" ]; then
            kubectl delete statefulset unguard-mariadb -n "$K8S_NAMESPACE" --ignore-not-found
          fi
          helm upgrade --install unguard-mariadb bitnami/mariadb "${helm_args[@]}"

      - name: Apply image tag override
        if: ${{ inputs.chart_source == 'local' && inputs.image_tag != '' }}
        run: |
          set -euo pipefail
          python3 -m pip install --user --quiet 'ruamel.yaml==0.18.6'
          python3 ops/eks/set-image-tag.py chart/values.yaml "$IMAGE_TAG"

      - name: Deploy with Helm
        env:
          CHART_REF: ${{ steps.chart.outputs.ref }}
          LB_SCHEME: ${{ vars.LB_SCHEME || 'internet-facing' }}
        run: |
          set -euo pipefail
          helm_args=(
            --namespace "$K8S_NAMESPACE"
            --create-namespace
            --set localDev.enabled=false
            --set "envoyProxy.service.type=$SERVICE_TYPE"
            --wait --timeout 10m
          )
          if [ "$CHART_SOURCE" = "local" ]; then
            CHART_TARGET="./chart"
          else
            CHART_TARGET="$CHART_REF"
            helm_args+=(--version "$CHART_VERSION")
          fi
          if [ "$SERVICE_TYPE" = "LoadBalancer" ]; then
            # Set at create time so the AWS CCM never provisions a classic ELB first.
            helm_args+=(
              --set "envoyProxy.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-type=external"
              --set "envoyProxy.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-nlb-target-type=instance"
              --set "envoyProxy.service.annotations.service\.beta\.kubernetes\.io/aws-load-balancer-scheme=$LB_SCHEME"
            )
          fi
          if [ "$ENABLE_APPSEC_DEMOS" = "true" ]; then
            helm_args+=(
              --set detectionStream.enabled=true
              --set incidentInjector.enabled=true
              --set kspmMisconfig.enabled=true
            )
          fi
          if [ "$ENABLE_AI_SERVICES" != "true" ]; then
            helm_args+=(--set ollama.enabled=false --set ragService.enabled=false)
          fi
          helm upgrade --install unguard "$CHART_TARGET" "${helm_args[@]}"

      - name: Print app URL
        if: ${{ inputs.service_type == 'LoadBalancer' }}
        run: |
          set -euo pipefail
          # envoy-proxy listens on 8080, not 80, and the NLB only has 8080/8081 listeners,
          # so the bare hostname is not a working URL. Read the port from the Service.
          PORT=$(kubectl get svc unguard-envoy-proxy -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.ports[?(@.name=="http")].port}' 2>/dev/null || true)
          PORT="${PORT:-8080}"
          echo "Waiting for LoadBalancer hostname..."
          for i in $(seq 1 18); do
            HOSTNAME=$(kubectl get svc unguard-envoy-proxy -n "$K8S_NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$HOSTNAME" ]; then
              URL="http://${HOSTNAME}:${PORT}"
              echo "App URL: $URL"
              echo "### App URL: $URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  waiting... ($i/18)"
            sleep 10
          done
          echo "::error::LoadBalancer hostname was not assigned within 3 minutes."
          kubectl describe svc unguard-envoy-proxy -n "$K8S_NAMESPACE" || true
          exit 1

      - name: Show pod status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
          echo ""
          echo "=== Recent namespace events ==="
          kubectl get events -n "$K8S_NAMESPACE" --sort-by=.lastTimestamp --field-selector type!=Normal | tail -30 || true
