name: Deploy to EKS (appsec-demo)

# Deploys Unguard to the appsec-demo namespace on the perform26 cluster.
#
# Unlike deploy-eks.yml, this workflow authenticates as a namespace-scoped
# identity: GHActions-Unguard-Deploy can describe only the perform26 cluster,
# and inside it can act only within appsec-demo. It holds no cluster-admin.
#
# Consequences of that scoping, versus deploy-eks.yml:
#   - no "register access entry" step -- the EKS access entry is created once,
#     out of band, and grants group membership rather than cluster-admin
#   - no AWS Load Balancer Controller install -- that lives in kube-system,
#     which this role cannot touch; it is a cluster-level prerequisite
#   - no --create-namespace -- namespaces are cluster-scoped

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Helm chart version to deploy (e.g. 0.23.0-cc934f4)'
        required: true
        default: '0.23.0-cc934f4'
      role_arn:
        description: 'IAM role assumed via OIDC. Not a secret -- an OIDC role is secured by its trust policy, which pins it to this repo.'
        required: false
        default: 'arn:aws:iam::124381674733:role/GHActions-Unguard-Deploy'

permissions:
  id-token: write
  contents: read
  packages: read

env:
  CLUSTER_NAME: perform26
  AWS_REGION: us-east-1
  K8S_NAMESPACE: appsec-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ inputs.role_arn }}
          role-session-name: GitHubActionsAppsecDemoDeploy

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOKEN="${GHCR_PAT:-$GITHUB_TOKEN}"
          echo "$TOKEN" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve chart namespace
        id: chart
        env:
          GHCR_NAMESPACE: ${{ secrets.GHCR_NAMESPACE }}
        run: |
          NS="${GHCR_NAMESPACE:-${{ github.repository }}}"
          NS=$(echo "$NS" | tr '[:upper:]' '[:lower:]')
          echo "version=${{ inputs.chart_version }}" >> "$GITHUB_OUTPUT"
          echo "namespace=$NS" >> "$GITHUB_OUTPUT"

      - name: Install MariaDB (prerequisite)
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update
          # Reuse existing password if secret exists
          EXTRA_ARGS=""
          if kubectl get secret unguard-mariadb -n "$K8S_NAMESPACE" &>/dev/null; then
            EXISTING_PW=$(kubectl get secret unguard-mariadb -n "$K8S_NAMESPACE" \
              -o jsonpath="{.data.mariadb-root-password}" | base64 -d)
            EXTRA_ARGS="--set auth.rootPassword=${EXISTING_PW}"
          fi
          # Delete the StatefulSet if it exists so Helm can recreate with updated spec
          kubectl delete statefulset unguard-mariadb -n "$K8S_NAMESPACE" --ignore-not-found
          helm upgrade --install unguard-mariadb bitnami/mariadb \
            --namespace "$K8S_NAMESPACE" \
            --set primary.persistence.enabled=false \
            --wait --timeout 5m \
            $EXTRA_ARGS

      - name: Deploy with Helm
        run: |
          helm upgrade --install unguard \
            "oci://ghcr.io/${{ steps.chart.outputs.namespace }}/unguard" \
            --version "${{ steps.chart.outputs.version }}" \
            --namespace "$K8S_NAMESPACE" \
            --set localDev.enabled=false \
            --set envoyProxy.service.type=LoadBalancer \
            --force-conflicts \
            --wait --timeout 10m

      - name: Annotate service for NLB
        run: |
          kubectl annotate svc unguard-envoy-proxy -n "$K8S_NAMESPACE" --overwrite \
            service.beta.kubernetes.io/aws-load-balancer-type=external \
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type=instance \
            service.beta.kubernetes.io/aws-load-balancer-scheme=internet-facing

      - name: Print app URL
        run: |
          echo "Waiting for LoadBalancer hostname..."
          for i in $(seq 1 18); do
            HOSTNAME=$(kubectl get svc unguard-envoy-proxy -n "$K8S_NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            if [ -n "$HOSTNAME" ]; then
              echo "App URL: http://$HOSTNAME"
              exit 0
            fi
            echo "  waiting... ($i/18)"
            sleep 10
          done
          echo "LoadBalancer hostname not yet assigned (ELB may still be provisioning)"

      - name: Show pod status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n "$K8S_NAMESPACE" -o wide
          echo ""
          echo "=== Not-ready pods (excluding cronjobs) ==="
          kubectl get pods -n "$K8S_NAMESPACE" -o json | \
            jq -r '.items[] | select(.status.phase != "Running" and (.metadata.ownerReferences[]?.kind != "Job")) | .metadata.name' 2>/dev/null | \
            xargs -r -I{} kubectl describe pod {} -n "$K8S_NAMESPACE" | \
            grep -A 10 "Events:\|Reason:\|Message:" || true
